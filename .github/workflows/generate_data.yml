name: Generate dash.json

on:
  schedule:
    - cron: '45 5 * * *'   # 11:15 AM IST (05:45 UTC)
    - cron: '30 12 * * *'  # 06:00 PM IST (12:30 UTC)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Write Google credentials
        run: echo '${{ secrets.GDRIVE_CREDENTIALS }}' > scripts/gdrive_credentials.json

      - name: Run generator
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GDRIVE_CREDENTIALS_FILE: gdrive_credentials.json
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: python scripts/generate_data.py --out "$RUNNER_TEMP/data.js" --dashboard-out src/dash.json

      - name: Commit and push dash.json
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/dash.json
          if git diff --staged --quiet; then echo "No data change."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "chore: auto-update dash.json [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Send email notification
        if: success() && steps.commit.outputs.changed == 'true'
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "DairyTop <onboarding@resend.dev>",
              "to": ["lakshman@knit-works.com"],
              "subject": "✅ DairyTop dash.json updated",
              "text": "dash.json was successfully updated.\n\nCommit: https://github.com/Lakshmanprabhuk/Dairytop/commit/${{ github.sha }}\nRun: https://github.com/Lakshmanprabhuk/Dairytop/actions/runs/${{ github.run_id }}"
            }'
