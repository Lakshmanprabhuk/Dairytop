name: Generate data.js

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 4 * * *'   # 10:00 AM IST (04:30 UTC)
    - cron: '45 5 * * *'   # 11:15 AM IST (05:45 UTC)
    - cron: '30 12 * * *'  # 06:00 PM IST (12:30 UTC)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Write Google credentials
        run: echo '${{ secrets.GDRIVE_CREDENTIALS }}' > scripts/gdrive_credentials.json

      - name: Run generator
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GDRIVE_CREDENTIALS_FILE: gdrive_credentials.json
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: python scripts/generate_data.py

      - name: Commit and push data.js
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/utils/data.js
          git commit -m "chore: auto-update data.js [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

      - name: Send email notification
        if: success()
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "DairyTop <onboarding@resend.dev>",
              "to": ["lakshman@knit-works.com"],
              "subject": "✅ DairyTop data.js updated",
              "text": "data.js was successfully updated.\n\nCommit: https://github.com/Lakshmanprabhuk/Dairytop/commit/${{ github.sha }}\nRun: https://github.com/Lakshmanprabhuk/Dairytop/actions/runs/${{ github.run_id }}"
            }'
